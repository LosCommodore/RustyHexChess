[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
strum = { version = "0.26", features = ["derive"] }
thiserror = "2.0.19"
anyhow = "1.0.103"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.22.0"

# Terminal rendering (the `display` module and the CLI). Neither builds for
# wasm, and the browser has no use for either.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ansi-to-html = "0.2.3"
crossterm = "0.29.0"

# Only the `wasm` module needs these, and only wasm32 builds compile it, so
# native builds and `cargo test` do not pay for them.
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
# Generates the TypeScript for every wire type in `api.rs`, so `engine.d.ts`
# cannot drift from the Rust definitions. wasm-only: the derives are applied
# through `cfg_attr`, so native builds and `cargo test` never see it.
tsify = "0.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement"] }

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
insta = "1.48.0"
