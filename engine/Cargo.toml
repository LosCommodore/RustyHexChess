[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
strum = { version = "0.26", features = ["derive"] }
thiserror = "2.0.19"
ansi-to-html = "0.2.3"
anyhow = "1.0.103"
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.22.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement"] }

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
insta = "1.48.0"
